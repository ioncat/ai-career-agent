name: career_agent
description: "Career Agent — AI-powered job counselor for PdM/PO/PM job search"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.3.3

  # Markdown rendering
  flutter_markdown: ^0.7.6

  # Desktop notifications (Windows/macOS/Linux)
  local_notifier: ^0.1.6

  # Date formatting
  intl: ^0.20.2

  # URL launcher
  url_launcher: ^6.3.1

  # File save dialog (PDF download)
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  # Bundled locally (2026-07-25) — google_fonts' runtime fetch/cache-read is
  # async, racing first-frame layout of IntrinsicWidth-sized widgets (found
  # live: SourceBadge pills truncated — "Dji…" — for up to ~a minute after
  # app start, self-correcting once the font swapped in with no relayout).
  # Bundled assets load synchronously before first frame — no race, period.
  # Variable fonts ([wght] axis) — one file per family covers every weight
  # used in app_theme.dart's TextTheme.
  fonts:
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 700
