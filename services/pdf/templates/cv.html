<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
    font-family: 'BodyFont';
    src: url('{{ font_dir }}/segoeui.ttf') format('truetype'),
         url('{{ font_dir }}/calibri.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}
@font-face {
    font-family: 'BodyFont';
    src: url('{{ font_dir }}/segoeuib.ttf') format('truetype'),
         url('{{ font_dir }}/calibrib.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
}
@font-face {
    font-family: 'BodyFont';
    src: url('{{ font_dir }}/segoeuii.ttf') format('truetype'),
         url('{{ font_dir }}/calibrii.ttf') format('truetype');
    font-weight: normal;
    font-style: italic;
}

@page {
    size: A4;
    margin: 20mm 22mm;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'BodyFont', 'Segoe UI', Calibri, Arial, sans-serif;
    font-size: 12pt;
    line-height: 1.45;
    color: #000;
}

/* ── Name ── */
h1 {
    font-size: 16pt;
    font-weight: bold;
    color: #000;
    margin-bottom: 1.5mm;
    line-height: 1.2;
}

/* ── Headline (paragraph immediately after h1) ── */
h1 + p {
    font-size: 12pt;
    color: #3c3c3c;
    margin-bottom: 1mm;
}

/* ── Section headers ── */
h2 {
    font-size: 12pt;
    font-weight: bold;
    color: #4285F4;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-top: 5mm;
    margin-bottom: 2mm;
}

/* ── Role titles (h3) ── */
h3 {
    font-size: 12pt;
    font-weight: bold;
    color: #000;
    margin-top: 3mm;
    margin-bottom: 1mm;
}

h4, h5, h6 {
    font-size: 11pt;
    font-weight: bold;
    color: #282828;
    margin-top: 2mm;
    margin-bottom: 1mm;
}

p {
    font-size: 12pt;
    margin-bottom: 2mm;
}

a {
    color: #1155CC;
    text-decoration: none;
}

hr {
    border: none;
    border-top: 0.3pt solid #bebebe;
    margin: 6mm 0 7mm 0;
}

ul, ol {
    margin: 1mm 0 2mm 6mm;
    padding: 0;
}

ul li, ol li {
    font-size: 12pt;
    margin-bottom: 1mm;
}

/* ── Tables (Fit Breakdown, Skills etc.) ── */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10pt;
    margin: 2mm 0 3mm 0;
}

thead tr {
    background: #ebebeb;
    font-weight: bold;
}

th, td {
    padding: 1.5mm 2mm;
    text-align: left;
    border: 0.3pt solid #d0d0d0;
    vertical-align: top;
}

/* ── Code / pre ── */
code {
    font-family: 'Courier New', monospace;
    font-size: 10pt;
    background: #f5f5f5;
    padding: 0 1mm;
}

pre {
    font-family: 'Courier New', monospace;
    font-size: 10pt;
    background: #f5f5f5;
    padding: 2mm;
    white-space: pre-wrap;
    word-break: break-all;
    margin-bottom: 3mm;
}

/* ── Page breaks ── */
h2 { page-break-after: avoid; }
h3 { page-break-after: avoid; }
table { page-break-inside: avoid; }
</style>
</head>
<body>
{{ content }}
</body>
</html>
