<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
    font-family: 'BodyFont';
    src: url('{{ font_dir }}/segoeui.ttf') format('truetype'),
         url('{{ font_dir }}/calibri.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}
@font-face {
    font-family: 'BodyFont';
    src: url('{{ font_dir }}/segoeuib.ttf') format('truetype'),
         url('{{ font_dir }}/calibrib.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
}
@font-face {
    font-family: 'BodyFont';
    src: url('{{ font_dir }}/segoeuii.ttf') format('truetype'),
         url('{{ font_dir }}/calibrii.ttf') format('truetype');
    font-weight: normal;
    font-style: italic;
}

@page {
    size: A4;
    margin: 0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'BodyFont', 'Segoe UI', Calibri, Arial, sans-serif;
    font-size: 12pt;
    line-height: 1.55;
    color: #1a1a1a;
}

/* ── Accent bar ── */
.accent-bar {
    background: #4285F4;
    height: 4mm;
    width: 100%;
}

/* ── Letterhead ── */
.letterhead {
    padding: 7mm 22mm 6mm 22mm;
    border-bottom: 0.4pt solid #d0d0d0;
}

.letterhead h1 {
    font-size: 15pt;
    font-weight: bold;
    color: #1a1a1a;
    line-height: 1.2;
    margin-bottom: 1mm;
}

/* Subtitle / headline line after h1 */
.letterhead p:first-of-type {
    font-size: 10.5pt;
    color: #555;
    margin-bottom: 1.5mm;
    line-height: 1.3;
}

/* Contacts line */
.letterhead p:last-of-type {
    font-size: 9.5pt;
    color: #555;
    line-height: 1.3;
}

.letterhead a {
    color: #4285F4;
    text-decoration: none;
}

/* ── Letter body ── */
.letter-body {
    padding: 10mm 22mm 15mm 22mm;
}

.letter-body p {
    font-size: 12pt;
    margin-bottom: 4mm;
    color: #1a1a1a;
}

.letter-body p:first-child {
    margin-bottom: 5mm;
}

.letter-body a {
    color: #4285F4;
    text-decoration: none;
}

hr { display: none; }
</style>
</head>
<body>
<div class="accent-bar"></div>
{% if letterhead %}
<div class="letterhead">{{ letterhead }}</div>
{% endif %}
<div class="letter-body">{{ body }}</div>
</body>
</html>
